version: "2"

run:
  tests: true
  build-tags:
    - integration

linters:
  # 禁用默认的 linters，只启用我们指定的
  default: none

  enable:
    # 核心检查（保留）
    - govet           # Go 官方审查工具
    - ineffassign     # 检测无效赋值
    - staticcheck     # 静态分析（最全面的检查，已包含大部分错误检查）
    - unused          # 检测未使用的代码
    - gosec           # 安全检查
    - misspell        # 拼写错误检查
    # errcheck（未检查错误，噪音太多）保持禁用

  settings:
    errcheck:
      check-type-assertions: false  # 不检查类型断言
      check-blank: false            # 不检查空白标识符
      # 排除常见的可以忽略错误的函数（errcheck 当前禁用，保留以便将来重新启用时复用）
      exclude-functions:
        # 数据库相关
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        # 文件和IO
        - (*os.File).Close
        - (io.Closer).Close
        - (*net/http.Response).Body.Close
        # WebSocket
        - (*github.com/coder/websocket.Conn).Close
        # HTTP
        - (net/http.ResponseWriter).Write
        # 格式化输出
        - fmt.Fprintf
        - fmt.Fprintln
        # 验证器
        - (*github.com/go-playground/validator/v10.Validate).RegisterValidation

    govet:
      enable-all: false
      # 只启用最重要的检查
      enable:
        - assign
        - atomic
        - bools
        - buildtag
        - nilfunc
        - printf

    misspell:
      locale: US

    staticcheck:
      # 排除一些检查以减少噪音
      checks:
        - all
        - -ST1000  # 包注释
        - -ST1003  # 首字母缩写
        - -SA5011  # possible nil pointer dereference (误报多)
      # 注意：staticcheck 不包含未检查错误的检查，那些是 errcheck 的

    gosec:
      # 排除一些低风险的检查
      excludes:
        - G104  # 未检查错误（由 errcheck 处理）
        - G304  # 文件路径由用户输入（某些场景下合理）

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 排除测试文件的某些检查
      - path: _test\.go
        linters:
          - errcheck   # 测试中可以不检查某些错误
          - gosec      # 测试中的安全检查不那么严格

      # 排除生成的文件
      - path: \.pb\.go$
        linters:
          - all

      # 排除 vendor 目录
      - path: vendor/
        linters:
          - all

      # 排除 defer 中的 Close 调用
      - text: "Error return value.*Close.*is not checked"
        linters:
          - errcheck

      # 排除非关键的环境设置
      - text: "Error return value of `os\\.(Setenv|RemoveAll)`"
        linters:
          - errcheck

      # 排除验证器注册错误（通常在初始化时处理）
      - text: "Error return value of.*RegisterValidation.*is not checked"
        linters:
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^web/  # 旧前端目录，其 node_modules 含第三方 Go 文件

issues:
  # 限制每个 linter 的问题数量（避免输出过多）
  max-issues-per-linter: 50
  max-same-issues: 3

formatters:
  enable:
    - gofmt           # 格式检查
    - goimports       # import 排序
  settings:
    gofmt:
      simplify: true  # 使用 -s 简化代码
    goimports:
      local-prefixes: []  # 本地包前缀（可选配置）
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^web/  # 旧前端目录，其 node_modules 含第三方 Go 文件
